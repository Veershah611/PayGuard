name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPAYGUARD_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Smoke run on sample data
        shell: bash
        run: |
          exe=build/payguard; [ -f build/Release/payguard.exe ] && exe=build/Release/payguard.exe
          "$exe" --threads 4

  sanitizers:
    name: ${{ matrix.sanitizer }} sanitizer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [thread, "address,undefined"]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DPAYGUARD_BUILD_BENCHMARKS=OFF -DPAYGUARD_SANITIZER=${{ matrix.sanitizer }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov
      - name: Build with coverage
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DPAYGUARD_BUILD_BENCHMARKS=OFF -DPAYGUARD_COVERAGE=ON
          cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Report
        run: |
          lcov --capture --directory build --output-file coverage.info --ignore-errors mismatch
          lcov --extract coverage.info "*/src/*" "*/include/payguard/*" --output-file coverage.info
          lcov --list coverage.info
